name: Build and Release

# builds the installer and portable packages;
# triggered by version tags (v*) or manually from the Actions tab
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read version from NSIS script
        id: version
        shell: bash
        run: echo "version=$(sed -n 's/^!define APPL_VERSION "\([^"]*\)".*/\1/p' install/balloonRSS.nsi)" >> "$GITHUB_OUTPUT"

      - name: Publish installer build (framework-dependent)
        run: dotnet publish src/BalloonRss.csproj -c Release -r win-x64 --self-contained false -o publish/installer

      - name: Publish portable build (framework-dependent)
        run: dotnet publish src/BalloonRss.csproj -c Release -r win-x64 --self-contained false -p:Portable=true -o publish/portable

      - name: Create portable data folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path publish/portable/data | Out-Null
          Set-Content -Path publish/portable/data/.keep -Value "BalloonRSS stores its portable data in this folder."

      - name: Create portable zip
        shell: pwsh
        run: Compress-Archive -Path publish/portable/* -DestinationPath "BalloonRSS_${{ steps.version.outputs.version }}_portable.zip" -Force

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build NSIS installer (lite, without bundled runtime)
        shell: pwsh
        run: '& "C:\Program Files (x86)\NSIS\makensis.exe" /V3 install/balloonRSS.nsi'

      - name: Download .NET Desktop Runtime 10 (bundled into full installer)
        shell: pwsh
        run: Invoke-WebRequest -Uri "https://aka.ms/dotnet/10.0/windowsdesktop-runtime-win-x64.exe" -OutFile dotnet-runtime.exe

      - name: Build NSIS installer (with bundled runtime)
        shell: pwsh
        run: '& "C:\Program Files (x86)\NSIS\makensis.exe" /V3 /DDOTNET_RUNTIME_BUNDLED install/balloonRSS.nsi'

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: BalloonRSS ${{ steps.version.outputs.version }}
          body: |
            ## BalloonRSS ${{ steps.version.outputs.version }}

            ### Highlights
            * Clicking a news balloon now opens the article in a small embedded browser window
              (falls back to the default browser if the WebView2 runtime is not installed).
            * The article window reliably appears in the foreground when opened from a
              notification click.
            * The slim installer is now the default `setup.exe`; the installer with the bundled
              .NET Desktop Runtime is available as `setup_with_dependencies.exe`.

            Based on the .NET 10 migration which fixes connection errors with RSS feeds
            that require TLS 1.2+.

            ### Downloads
            * **BalloonRSS_${{ steps.version.outputs.version }}_setup.exe** - slim installer;
              requires the .NET Desktop Runtime 10. If it is missing, the installer offers to open
              the official download page.
            * **BalloonRSS_${{ steps.version.outputs.version }}_setup_with_dependencies.exe** - full
              installer with the .NET Desktop Runtime 10 bundled (works offline).
            * **BalloonRSS_${{ steps.version.outputs.version }}_portable.zip** - portable version;
              all data is stored in a `data` folder next to the executable. Also requires the
              .NET Desktop Runtime 10.
          files: |
            install/BalloonRSS_${{ steps.version.outputs.version }}_setup.exe
            install/BalloonRSS_${{ steps.version.outputs.version }}_setup_with_dependencies.exe
            BalloonRSS_${{ steps.version.outputs.version }}_portable.zip
